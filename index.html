<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open PO - IMAN SHOP </title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f7f3ef; color: #4a3b32; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1, h2 { text-align: center; color: #5c4033; margin-bottom: 5px; }
    p.subtitle { text-align: center; font-size: 0.9em; color: #8c7a6b; margin-top: 0; }
    .category { font-weight: bold; background: #e8ded5; padding: 8px 12px; border-radius: 6px; margin-top: 20px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px border-style: dashed; border-color: #eee; }
    .menu-info { flex: 1; }
    .menu-name { font-weight: 600; }
    .menu-price { color: #8c7a6b; font-size: 0.9em; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-btn { background: #d7ccc8; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    .qty-btn:hover { background: #bcaaa4; }
    .form-group { margin-top: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
    .total-box { background: #f5ebe6; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: right; font-size: 1.2em; font-weight: bold; }
    .btn-submit { width: 100%; background: #6d4c41; color: white; border: none; padding: 14px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    .btn-submit:hover { background: #5d4037; }
    
    /* Modal QRIS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; }
    .qris-img { width: 100%; max-width: 250px; margin: 15px 0; border-radius: 8px; }
    .btn-wa { background: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>IMAN SHOP </h1>
  <p class="subtitle">Form Order Pre-Order (PO)</p>
  <form id="orderForm">
    <div class="form-group">
      <label>Nama Lengkap*</label>
      <input type="text" id="nama" required placeholder="Contoh: Budi Santoso">
    </div>
    <div class="form-group">
      <label>Nomor WhatsApp*</label>
      <input type="tel" id="whatsapp" required placeholder="08123456789">
    </div>

    <div class="category">Puff Pastry (Sweet)</div>
    <div id="sweet-menu"></div>

    <div class="category">Puff Pastry (Savory)</div>
    <div id="savory-menu"></div>

    <div class="form-group">
      <label>Catatan Khusus (Opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Contoh: Jangan terlalu manis / bungkus terpisah"></textarea>
    </div>

    <div class="total-box">
      Total: Rp <span id="totalHarga">0</span>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Bayar & Kirim Pesanan</button>
  </form>
</div>

<!-- Modal Pembayaran QRIS -->
<div class="modal" id="qrisModal">
  <div class="modal-content">
    <h2>Pembayaran QRIS</h2>
    <p>Scan QRIS di bawah ini untuk membayar sebesar:</p>
    <h3 style="color: #6d4c41; margin: 5px 0;" id="qrisTotal">Rp 0</h3>
    
    <!-- GANTI LINK GAMBAR DI BAWAH DENGAN GAMBAR QRIS KAMU -->
    <img src="https://i.ibb.co.com/G4PhK3gP/Whats-App-Image-2026-07-28-at-14-57-20.jpg">
    
    <p style="font-size: 0.85em; color: #666;">Setelah transfer, klik tombol di bawah untuk konfirmasi bukti pembayaran via WhatsApp.</p>
    <a href="#" id="waLink" target="_blank" class="btn-wa">Konfirmasi via WhatsApp</a>
  </div>
</div>

<script>
  // GANTI DENGAN URL GOOGLE APPS SCRIPT KAMU
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDDljHxUEMkjjyywNKfNDkOLWnHY_0nX2nL-lWFXkDlzjIlw_iwLOMdTKFIZZ5ZUoegA/exec"; 
  // GANTI DENGAN NOMOR WA KAMU (Format 62)
  const NO_WA = "6282184260191"; 

  const menuSweet = [
    { name: "Roll Cream Choco ★", price: 18000 },
    { name: "Room Horn Vanilla ★", price: 18000 },
    { name: "Fruit Tart ★", price: 23000 },
    { name: "Strawberry Jam Cheese", price: 18000 },
    { name: "Blueberry Jam Cheese", price: 18000 },
    { name: "Choco Crunchy ★", price: 18000 },
    { name: "Banana Choco Crunchy", price: 18000 },
    { name: "Banana Milk Crispy ★", price: 18000 },
    { name: "Egg Tart ★", price: 17000 },
    { name: "Durian", price: 18000 },
    { name: "Green Tea", price: 18000 },
    { name: "Apple Cinnamon ★", price: 18000 },
    { name: "Pineapple Jam", price: 18000 },
    { name: "Choco Melt ★", price: 18000 },
    { name: "Brown Sugar Butter", price: 18000 },
    { name: "Almond Puff Pastry ★", price: 18000 },
    { name: "Srikaya Puff Pastry", price: 18000 },
    { name: "Choco Cheese ★", price: 18000 },
    { name: "Marshtella ★", price: 18000 },
    { name: "Sugar Sprinkles", price: 16000 },
    { name: "Cream Cheese ★", price: 18000 },
    { name: "Mix Raisin", price: 18000 },
    { name: "Tiramisu", price: 16000 }
  ];

  const menuSavory = [
    { name: "Chicken Oregano Cheese ★", price: 20000 },
    { name: "Tuna ★", price: 18000 },
    { name: "Cheese ★", price: 18000 },
    { name: "Pizza", price: 23000 },
    { name: "Mashed Potato", price: 18000 },
    { name: "Sausage Mozzarella", price: 23000 },
    { name: "Bolognese", price: 20000 },
    { name: "Abon Puff Pastry", price: 20000 },
    { name: "Smoke Beef Mayo ★", price: 23000 }
  ];

  let cart = {};

  function renderMenu(list, containerId) {
    const container = document.getElementById(containerId);
    list.forEach((item, index) => {
      const id = containerId + "_" + index;
      cart[id] = { ...item, qty: 0 };
      
      const div = document.createElement("div");
      div.className = "menu-item";
      div.innerHTML = `
        <div class="menu-info">
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
        </div>
        <div class="qty-control">
          <button type="button" class="qty-btn" onclick="updateQty('${id}', -1)">-</button>
          <span id="qty_${id}">0</span>
          <button type="button" class="qty-btn" onclick="updateQty('${id}', 1)">+</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function updateQty(id, change) {
    if (cart[id].qty + change >= 0) {
      cart[id].qty += change;
      document.getElementById(`qty_${id}`).innerText = cart[id].qty;
      calculateTotal();
    }
  }

  function calculateTotal() {
    let total = 0;
    Object.values(cart).forEach(item => {
      total += item.qty * item.price;
    });
    document.getElementById("totalHarga").innerText = total.toLocaleString('id-ID');
    return total;
  }

  renderMenu(menuSweet, "sweet-menu");
  renderMenu(menuSavory, "savory-menu");

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const total = calculateTotal();
    
    if (total === 0) {
      alert("Silakan pilih minimal 1 menu pesanan.");
      return;
    }

    const nama = document.getElementById("nama").value;
    const whatsapp = document.getElementById("whatsapp").value;
    const catatan = document.getElementById("catatan").value;

    let pesananArr = [];
    Object.values(cart).forEach(item => {
      if (item.qty > 0) {
        pesananArr.push(`${item.name} (${item.qty}x)`);
      }
    });
    const pesananText = pesananArr.join(", ");

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Memproses Pesanan...";
    btn.disabled = true;

    // Kirim data ke Google Sheets
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        nama: nama,
        whatsapp: whatsapp,
        pesanan: pesananText,
        total: "Rp " + total.toLocaleString('id-ID'),
        catatan: catatan
      })
    })
    .then(res => res.json())
    .then(data => {
      btn.innerText = "Bayar & Kirim Pesanan";
      btn.disabled = false;

      // Tampilkan Modal QRIS
      document.getElementById("qrisTotal").innerText = "Rp " + total.toLocaleString('id-ID');
      
      // Buat Format Pesan WA
      const textWA = `Halo IMAN SHOP, saya sudah melakukan pembayaran via QRIS.%0A%0A*Detail Pesanan:*%0A- Nama: ${nama}%0A- Pesanan: ${pesananText}%0A- Total: Rp ${total.toLocaleString('id-ID')}%0A- Catatan: ${catatan || '-'}`;
      document.getElementById("waLink").href = `https://wa.me/${NO_WA}?text=${textWA}`;

      document.getElementById("qrisModal").style.display = "flex";
    })
    .catch(err => {
      alert("Terjadi kesalahan, coba lagi.");
      btn.innerText = "Bayar & Kirim Pesanan";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
